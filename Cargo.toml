[package]
name = "cst92xx"
version = "0.1.0"
edition = "2024"
authors = ["Sebastian Almendra"]
license = "MIT"
repository = "https://github.com/ScripTerasu/cst92xx-touch-driver"
description = "Driver crate for CST92xx (CST9217 and CST9220) touch controllers with async and blocking embedded-hal support."
keywords = ["touchscreen", "embedded-hal", "embedded", "i2c", "cst92xx"]
categories = ["embedded", "hardware-support"]
readme = "README.md"
exclude = ["docs/", ".*"]

[package.metadata.docs.rs]
# `async` and `blocking` both export a `CST92xx` type at the crate root and
# are mutually exclusive (see the compile_error! in src/lib.rs) — build docs
# with the default feature set instead of `--all-features`.
features = ["async", "defmt"]

[dependencies]
embedded-hal = "1.0.0"                                    # siempre: OutputPin (RST)
embedded-hal-async = { version = "1.0.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
defmt = { version = "1.1.1", optional = true }

[features]
default = ["async"]
async = ["dep:embedded-hal-async", "dep:embassy-time"]
blocking = []
defmt = ["dep:defmt"]

[dev-dependencies]
futures = "0.3"
embedded-hal-mock = { version = "0.11", features = ["embedded-hal-async", "eh1"] }
